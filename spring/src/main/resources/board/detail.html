<!DOCTYPE html>
<html lang="ko" xmlns="http://www.thymeleaf.org">
<body>
    <h1 th:text="${board.title}">제목</h1>

    <p>작성자: <span th:text="${board.writer}">작성자</span></p>
    <p>작성일: <span th:text="${board.createdAt}">작성일</span></p>
    <hr>
    <p th:text="${board.content}">내용</p>

    <p>
        <a th:href="@{/boards/{id}/edit(id=${board.id})}">수정</a>
        <a th:href="@{/boards}">목록</a>
    </p>
    <!--삭제 요청을 POST 방식으로 전송한다.-->
    <form th:action="@{/boards/{id}/delete(id=${board.id})}" method="post">
        <button type="submit">삭제</button>
    </form>
</body>
</html>
