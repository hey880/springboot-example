<!DOCTYPE html>
<!--xmlns:th는 Thymeleaf문법을 사용하기 위한 선언-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"> <!--한글 안 깨지도록 UTF-8로 인코딩-->
    <title>Spring Boot 시작하기</title>
</head>
<body>
    <h1>Spring Boot 4.x</h1>
    <!-- Controller에 전달할 message 값 -->
    <!-- th:text는 태그 내부의 기본 문장을 시제 데이터로 바꿔서 출력-->
    <p th:text="${message}">메시지가 출력됩니다.</p>
</body>
</html>
